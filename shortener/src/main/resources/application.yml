spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shortener
    username: shortener
    password: shortener
  jpa:
    hibernate.ddl-auto: validate      # Flyway owns the schema, Hibernate only checks it
    open-in-view: false
  data.redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 500             # if Kafka is down, fail fast instead of freezing redirects
    consumer:
      group-id: analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.shortener.analytics
        spring.json.value.default.type: com.example.shortener.analytics.ClickMessage
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  base-url: http://localhost:8080
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
    ttl-minutes: 60
  cache.ttl-hours: 24